name: SoftPilot cross-platform CI

on:
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - ".cargo/**"
      - "apps/**"
      - "crates/**"
      - "eng/**"
      - "fixtures/**"
      - "specs/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
  push:
    paths:
      - ".github/workflows/ci.yml"
      - ".cargo/**"
      - "apps/**"
      - "crates/**"
      - "eng/**"
      - "fixtures/**"
      - "specs/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: softpilot-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows 2025 x64
            runner: windows-2025
            linux: false
          - name: macOS 15 ARM64
            runner: macos-15
            linux: false
          - name: macOS 15 Intel
            runner: macos-15-intel
            linux: false
          - name: Ubuntu 24.04 x64
            runner: ubuntu-24.04
            linux: true

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      SLINT_BACKEND: winit-software

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Ubuntu GUI build and smoke-test dependencies
        if: matrix.linux
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libfontconfig1-dev \
            libxkbcommon-x11-0 \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libgl1-mesa-dev \
            xvfb

      - name: Install locked Rust toolchain
        shell: pwsh
        run: >-
          rustup toolchain install 1.97.1
          --profile minimal
          --component rustfmt,clippy
          --target wasm32-wasip2

      - name: Check formatting
        shell: pwsh
        run: cargo fmt --all -- --check

      - name: Check workspace
        shell: pwsh
        run: cargo check --workspace --all-targets --locked

      - name: Run Clippy
        shell: pwsh
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run workspace tests
        shell: pwsh
        run: cargo test --workspace --all-targets --locked

      - name: Run Component boundary tests
        shell: pwsh
        run: ./eng/test-lifecycle-component.ps1

      - name: Run Windows and macOS platform spike
        if: matrix.linux == false
        shell: pwsh
        run: ./eng/test-platform-spike.ps1

      - name: Run Linux platform spike under Xvfb
        if: matrix.linux
        shell: bash
        run: |
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp -ac >"$RUNNER_TEMP/xvfb.log" 2>&1 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true' EXIT
          for _ in {1..20}; do
            if [[ -S /tmp/.X11-unix/X99 ]]; then
              break
            fi
            sleep 0.25
          done
          if [[ ! -S /tmp/.X11-unix/X99 ]]; then
            cat "$RUNNER_TEMP/xvfb.log"
            exit 1
          fi
          DISPLAY=:99 pwsh -NoProfile -File ./eng/test-platform-spike.ps1
