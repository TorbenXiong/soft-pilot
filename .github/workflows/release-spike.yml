name: SoftPilot release spike

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/release-spike.yml"
      - ".cargo/**"
      - "apps/softpilot-gui/**"
      - "crates/softpilot-plugin-api/**"
      - "eng/package-release.ps1"
      - "eng/test-release-artifact.ps1"
      - "eng/release/**"
      - "fixtures/lifecycle-component/**"
      - "specs/plugin/wit/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"

permissions:
  contents: read

concurrency:
  group: softpilot-release-spike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows 2025 x64
            platform_id: windows-x64
            runner: windows-2025
            linux: false
          - name: macOS 15 ARM64
            platform_id: macos-arm64
            runner: macos-15
            linux: false
          - name: macOS 15 Intel
            platform_id: macos-x64
            runner: macos-15-intel
            linux: false
          - name: Ubuntu 24.04 x64
            platform_id: linux-x64
            runner: ubuntu-24.04
            linux: true

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Ubuntu GUI build dependencies
        if: matrix.linux
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libfontconfig1-dev \
            libxkbcommon-x11-0 \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libgl1-mesa-dev

      - name: Install locked Rust toolchain
        shell: pwsh
        run: >-
          rustup toolchain install 1.97.1
          --profile minimal
          --target wasm32-wasip2

      - name: Download and verify linuxdeploy
        if: matrix.linux
        shell: bash
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/linuxdeploy-x86_64.AppImage" \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          echo "c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  $RUNNER_TEMP/linuxdeploy-x86_64.AppImage" \
            | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/linuxdeploy-x86_64.AppImage"

      - name: Build release payload
        shell: pwsh
        run: |
          $arguments = @{
            PlatformId = '${{ matrix.platform_id }}'
            OutputDirectory = Join-Path $env:RUNNER_TEMP 'softpilot-artifacts'
          }
          if ('${{ matrix.linux }}' -eq 'true') {
            $arguments.LinuxDeployPath = Join-Path $env:RUNNER_TEMP 'linuxdeploy-x86_64.AppImage'
          }
          ./eng/package-release.ps1 @arguments

      - name: Upload release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: softpilot-spike-${{ matrix.platform_id }}
          path: ${{ runner.temp }}/softpilot-artifacts/${{ matrix.platform_id }}/release
          if-no-files-found: error
          retention-days: 14

      - name: Upload validation payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: softpilot-spike-validation-${{ matrix.platform_id }}
          path: ${{ runner.temp }}/softpilot-artifacts/${{ matrix.platform_id }}/validation
          if-no-files-found: error
          retention-days: 14

  verify-release:
    name: Verify ${{ matrix.name }} without Rust
    needs: build-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows 2025 x64
            platform_id: windows-x64
            runner: windows-2025
            linux: false
          - name: macOS 15 ARM64
            platform_id: macos-arm64
            runner: macos-15
            linux: false
          - name: macOS 15 Intel
            platform_id: macos-x64
            runner: macos-15-intel
            linux: false
          - name: Ubuntu 24.04 x64
            platform_id: linux-x64
            runner: ubuntu-24.04
            linux: true

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    env:
      SLINT_BACKEND: winit-software

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: softpilot-spike-${{ matrix.platform_id }}
          path: ${{ runner.temp }}/softpilot-release

      - name: Download validation payload
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: softpilot-spike-validation-${{ matrix.platform_id }}
          path: ${{ runner.temp }}/softpilot-validation

      - name: Install clean-runner display server
        if: matrix.linux
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends xvfb

      - name: Verify Windows and macOS release payload
        if: matrix.linux == false
        shell: pwsh
        run: >-
          & "$env:RUNNER_TEMP/softpilot-validation/test-release-artifact.ps1"
          -PlatformId '${{ matrix.platform_id }}'
          -ReleaseDirectory "$env:RUNNER_TEMP/softpilot-release"
          -ValidationDirectory "$env:RUNNER_TEMP/softpilot-validation"
          -ReportPath "$env:RUNNER_TEMP/softpilot-report/release-verification.json"

      - name: Verify Linux release payload under Xvfb
        if: matrix.linux
        shell: bash
        run: |
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp -ac >"$RUNNER_TEMP/xvfb.log" 2>&1 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true' EXIT
          for _ in {1..20}; do
            if [[ -S /tmp/.X11-unix/X99 ]]; then
              break
            fi
            sleep 0.25
          done
          if [[ ! -S /tmp/.X11-unix/X99 ]]; then
            cat "$RUNNER_TEMP/xvfb.log"
            exit 1
          fi
          DISPLAY=:99 pwsh -NoProfile -File \
            "$RUNNER_TEMP/softpilot-validation/test-release-artifact.ps1" \
            -PlatformId '${{ matrix.platform_id }}' \
            -ReleaseDirectory "$RUNNER_TEMP/softpilot-release" \
            -ValidationDirectory "$RUNNER_TEMP/softpilot-validation" \
            -ReportPath "$RUNNER_TEMP/softpilot-report/release-verification.json"

      - name: Upload verification report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: softpilot-spike-report-${{ matrix.platform_id }}
          path: ${{ runner.temp }}/softpilot-report/release-verification.json
          if-no-files-found: error
          retention-days: 14
