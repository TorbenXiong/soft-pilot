[workspace]
members = [
    "apps/softpilot-gui",
    "apps/spt",
    "crates/softpilot-core",
    "crates/softpilot-plugin-api",
    "fixtures/lifecycle-component",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"

[workspace.dependencies]
clap = { version = "=4.6.4", default-features = false, features = ["derive", "error-context", "help", "std", "suggestions", "usage"] }
semver = { version = "=1.0.28", features = ["serde"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
slint = { version = "=1.17.1", default-features = false, features = ["accessibility", "backend-winit", "compat-1-2", "renderer-femtovg", "renderer-software", "std"] }
slint-build = "=1.17.1"
thiserror = "=2.0.19"
wasmtime = { version = "=47.0.2", default-features = false, features = ["component-model", "cranelift", "runtime", "std"] }
wit-bindgen = { version = "=0.58.0", default-features = false, features = ["macros", "realloc"] }
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
