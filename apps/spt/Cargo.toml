[package]
name = "spt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["component-validation"]
component-validation = ["softpilot-plugin-api/component-validation"]

[[bin]]
name = "spt"
path = "src/main.rs"

[dependencies]
clap.workspace = true
serde_json.workspace = true
softpilot-engine = { path = "../../crates/softpilot-engine" }
softpilot-plugin-api = { path = "../../crates/softpilot-plugin-api", default-features = false }

[lints]
workspace = true
